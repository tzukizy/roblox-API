name: Scrape Roblox & ScriptBlox Data

on:
  schedule:
    # Run every 3 days at 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    inputs:
      force_push:
        description: 'Force push even if no major changes'
        required: false
        type: boolean
        default: false
      clear_cdn_cache:
        description: 'Clear CDN image cache (keeps place-to-universe)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scraper-data
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape and Update Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore / Save Scraper Cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: scraper-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            scraper-cache-${{ runner.os }}-

      - name: Clear CDN cache on demand
        if: ${{ inputs.clear_cdn_cache }}
        run: rm -f .cache/cdn-images.json

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Run verification tests
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          CDN_URL: ${{ secrets.CDN_URL }}
          CDN_API_KEY: ${{ secrets.CDN_API_KEY }}
        run: npm test

      - name: Execute Scraper
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          CDN_URL: ${{ secrets.CDN_URL }}
          CDN_API_KEY: ${{ secrets.CDN_API_KEY }}
        run: npm run scrape

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add data/

          if git diff --staged --quiet; then
            echo "No data changes detected. Working tree clean."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "chore(data): sync scraper data [$TIMESTAMP] [skip ci]"
            git fetch origin main
            git rebase -X ours origin/main
            git push origin main
          fi
