name: Scrape Roblox & ScriptBlox Data

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_push:
        description: 'Force push even if no major changes'
        required: false
        type: boolean
        default: false
      clear_cdn_cache:
        description: 'Clear CDN image cache (keeps place-to-universe)'
        required: false
        type: boolean
        default: false
      reset_executor_cache:
        description: 'Reset executor thumbnail cache only (keeps all scripts & games)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scraper-data
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape and Update Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore / Save Scraper Cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: scraper-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            scraper-cache-${{ runner.os }}-

      - name: Clear CDN cache on demand
        if: ${{ inputs.clear_cdn_cache }}
        run: rm -f .cache/cdn-images.json

      - name: Reset executor thumbnail cache on demand
        if: ${{ inputs.reset_executor_cache }}
        run: node src/utils/reset-executor-cache.js

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Run verification tests
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          CDN_URL: ${{ secrets.CDN_URL }}
          CDN_API_KEY: ${{ secrets.CDN_API_KEY }}
          MEDIA_URL: ${{ secrets.MEDIA_URL }}
          HASH_KEY: ${{ secrets.HASH_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: npm test

      - name: Execute Scraper
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          CDN_URL: ${{ secrets.CDN_URL }}
          CDN_API_KEY: ${{ secrets.CDN_API_KEY }}
          MEDIA_URL: ${{ secrets.MEDIA_URL }}
          HASH_KEY: ${{ secrets.HASH_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: npm run scrape

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add data/

          if git diff --staged --quiet; then
            echo "No data changes detected. Working tree clean."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "chore(data): sync scraper data [$TIMESTAMP] [skip ci]"
            git fetch origin main
            git rebase -X ours origin/main
            git push origin main
          fi

      - name: Purge jsDelivr CDN edge cache
        run: |
          echo "Purging jsDelivr edge cache for main dataset index files..."
          curl -s "https://purge.jsdelivr.net/gh/tzukizy/roblox-API@main/data/home/trending.json" || true
          curl -s "https://purge.jsdelivr.net/gh/tzukizy/roblox-API@main/data/home/latest.json" || true
          curl -s "https://purge.jsdelivr.net/gh/tzukizy/roblox-API@main/data/home/topscript.json" || true
          for i in {1..10}; do
            curl -s "https://purge.jsdelivr.net/gh/tzukizy/roblox-API@main/data/home/latest/${i}.json" || true
          done
          curl -s "https://purge.jsdelivr.net/gh/tzukizy/roblox-API@main/data/trending/day.json" || true
          curl -s "https://purge.jsdelivr.net/gh/tzukizy/roblox-API@main/data/trending/week.json" || true
          curl -s "https://purge.jsdelivr.net/gh/tzukizy/roblox-API@main/data/trending/month.json" || true
          curl -s "https://purge.jsdelivr.net/gh/tzukizy/roblox-API@main/data/trending/all.json" || true
          curl -s "https://purge.jsdelivr.net/gh/tzukizy/roblox-API@main/data/keyless/scripts.json" || true
          curl -s "https://purge.jsdelivr.net/gh/tzukizy/roblox-API@main/data/verified/scripts.json" || true
          curl -s "https://purge.jsdelivr.net/gh/tzukizy/roblox-API@main/data/unpatched/scripts.json" || true
          curl -s "https://purge.jsdelivr.net/gh/tzukizy/roblox-API@main/data/game/games.json" || true
          echo "jsDelivr cache purge requests dispatched."
